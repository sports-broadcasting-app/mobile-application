name: Match data

on:
  # The Cloudflare Worker in infra/cloudflare/data-trigger starts this through
  # workflow_dispatch: a "full" run at 06:00 Brasília and "live" runs about
  # every 10 minutes during game windows (see the Worker). GitHub's cron is
  # best effort, so it only backs up the morning run: it runs when the
  # published file is over 2 hours old.
  schedule:
    - cron: '40 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full: everything; live: only the competitions listed'
        type: choice
        options: [full, live]
        default: full
      competitions:
        description: 'live mode: comma-separated slugs (nfl,nba,...)'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: match-data
  cancel-in-progress: false

jobs:
  # The backup cron only runs when the Worker's morning run did not happen.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          generated=$(curl -s "https://dados.onde-passa.app/onde-passa.json?t=$(date +%s)" | jq -r '.generatedAt // empty')
          age=$(( $(date +%s) - $(date -d "${generated:-1970-01-01}" +%s) ))
          echo "published file is ${age}s old"
          if [ "$age" -gt 7200 ]; then echo "run=true"; else echo "run=false"; fi >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A failed or suspicious source keeps its competitions from the file online
      # (a warning on the run); the run fails only when nothing new was collected.
      - id: collect
        run: node scripts/collect.ts public
        env:
          PREVIOUS_SNAPSHOT_URL: https://dados.onde-passa.app/onde-passa.json
          # full (default, scheduled runs) or live (Worker, game windows).
          COLLECT_MODE: ${{ inputs.mode || 'full' }}
          COLLECT_COMPETITIONS: ${{ inputs.competitions || '' }}
          # NBA quarter scores (API-Sports, free plan: 100 requests a day; the
          # collector asks one date per run at most). Missing key: no quarters.
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          # NFL live and quarter scores (Big Balls Sports Data, free plan: one
          # sport, 1,000 requests a day; at most two dates per run).
          BIGBALLS_KEY: ${{ secrets.BIGBALLS_KEY }}
      # The artifact service drops the connection now and then ("Failed to
      # FinalizeArtifact: ECONNRESET"); one more try after a pause.
      - id: upload1
        uses: actions/upload-pages-artifact@v5
        continue-on-error: true
        with:
          path: public
      - if: steps.upload1.outcome == 'failure'
        run: sleep 30
      - if: steps.upload1.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      # GitHub's OIDC token service sometimes times out ("Failed to get ID
      # Token"); the uploaded artifact is still there, so deploy it again.
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Where the app reads from since 1.2 (R2 behind dados.onde-passa.app, with
      # the Cloudflare cache in front). GitHub Pages above stays for older builds.
      # Runs even when the Pages deploy failed, so one host never blocks the other.
      - name: Publish to Cloudflare R2
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the newer default checksums of the AWS CLI.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: >-
          aws s3 cp public/onde-passa.json s3://onde-passa-data/onde-passa.json
          --endpoint-url "$R2_ENDPOINT"
          --content-type application/json
          --cache-control "public, max-age=300"
