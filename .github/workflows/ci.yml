name: CI

# Quality gates for every pull request to main (and main itself). The ruleset
# on main requires the "checks" job to pass, so keep that job name.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn type-check
      - run: yarn lint --max-warnings 0
      - run: yarn format:check
      # Includes the collector parsers against saved pages (no network). The
      # coverage floor is in jest.config.js (coverageThreshold).
      - run: yarn test --ci --coverage --coverageReporters=text-summary
      # The JavaScript bundles an `eas update` would ship: catches what only
      # Metro sees, such as an import Jest resolves but the app cannot.
      - run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/export"
      # Expo SDK packages behind what this SDK expects. A warning only: Expo
      # publishes patches with no change here, and a required check must not
      # turn red on its own. Fix with `npx expo install --fix` and a rebuild.
      - name: Expo SDK versions
        run: npx expo install --check || echo "::warning title=Expo SDK versions::Some packages are behind the SDK; run npx expo install --fix (native modules need a new build)"
