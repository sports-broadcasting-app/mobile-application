name: CI

# Quality gates for every pull request to main (and main itself). The ruleset
# on main requires the "checks" job to pass, so keep that job name.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn type-check
      - run: yarn lint --max-warnings 0
      - run: yarn format:check
      # Includes the collector parsers against saved pages (no network).
      - run: yarn test --ci
