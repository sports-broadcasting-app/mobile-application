version: 2
updates:
  # Grouped, so a week of updates is one PR instead of dozens. Expo pins its
  # own packages (~58.x); jumps to a new SDK go through expo-upgrade, not here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
  # The workflows' actions (would have flagged the Node 20 deprecation).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
