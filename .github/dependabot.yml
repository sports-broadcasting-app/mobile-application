version: 2
updates:
  # Libraries outside the Expo SDK, grouped so a week of updates is one PR.
  # Packages the Expo SDK pins (expo, expo-*, react, react-native, the native
  # react-native-* modules, typescript) are ignored here: Expo expects exact
  # versions (react 19.3.0, not 19.3.1), so they move together with
  # `npx expo install --check` / `--fix`, or an SDK upgrade (expo-upgrade skill).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-test-renderer'
      - dependency-name: 'react-native'
      # Named one by one: react-native-google-mobile-ads is not pinned by Expo
      # and keeps its updates (native code: needs a new build to test).
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-screens'
      - dependency-name: 'react-native-svg'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: 'typescript'
  # The workflows' actions (would have flagged the Node 20 deprecation).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
